name: render3d

# Starts when render.json changes (push) or by hand (Actions -> render3d -> Run workflow).
on:
  push:
    paths: ["render.json"]
  workflow_dispatch:
    inputs:
      project: { description: "folder in projects/", required: false, default: "" }
      shards: { description: "machines", required: false, default: "" }
      spp: { description: "samples per pixel", required: false, default: "" }
      pct: { description: "resolution percent", required: false, default: "" }

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      project: ${{ steps.cfg.outputs.project }}
      shards: ${{ steps.cfg.outputs.shards }}
      spp: ${{ steps.cfg.outputs.spp }}
      pct: ${{ steps.cfg.outputs.pct }}
      matrix: ${{ steps.cfg.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - id: cfg
        env:
          IN_PROJECT: ${{ inputs.project }}
          IN_SHARDS: ${{ inputs.shards }}
          IN_SPP: ${{ inputs.spp }}
          IN_PCT: ${{ inputs.pct }}
        run: |
          python - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, os
          c = json.load(open("render.json"))
          p = os.environ.get("IN_PROJECT") or c["project"]
          n = int(os.environ.get("IN_SHARDS") or c.get("shards", 20))
          print(f"project={p}")
          print(f"shards={n}")
          print(f"spp={os.environ.get('IN_SPP') or c.get('spp', 16)}")
          print(f"pct={os.environ.get('IN_PCT') or c.get('pct', 100)}")
          print("matrix=" + json.dumps(list(range(n))))
          EOF
      - run: pip install pymunk numpy scipy
      - run: python tools/plan3d.py projects/${{ steps.cfg.outputs.project }}
      - run: python tools/sound3d.py projects/${{ steps.cfg.outputs.project }}
      - uses: actions/upload-artifact@v4
        with:
          name: plan
          path: projects/${{ steps.cfg.outputs.project }}/out/

  render:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      P: projects/${{ needs.plan.outputs.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-render.txt
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libxrender1 libxxf86vm1 libxfixes3 libxi6 libxkbcommon0 libsm6 libgl1 libegl1
      - run: pip install -r requirements-render.txt
      - uses: actions/download-artifact@v4
        with: { name: plan, path: "${{ env.P }}/out/" }
      - run: python tools/render3d.py "$P" --shard ${{ matrix.shard }}/${{ needs.plan.outputs.shards }} --spp ${{ needs.plan.outputs.spp }} --pct ${{ needs.plan.outputs.pct }}
      - uses: actions/upload-artifact@v4
        with:
          name: rgba-${{ matrix.shard }}
          path: ${{ env.P }}/out/rgba/
          compression-level: 0

  final:
    needs: [plan, render]
    runs-on: ubuntu-24.04
    env:
      P: projects/${{ needs.plan.outputs.project }}
      NAME: ${{ needs.plan.outputs.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install numpy opencv-python-headless pillow
      - uses: actions/download-artifact@v4
        with: { name: plan, path: "${{ env.P }}/out/" }
      - uses: actions/download-artifact@v4
        with: { pattern: "rgba-*", merge-multiple: true, path: "${{ env.P }}/out/rgba/" }
      - run: python tools/compose.py "$P"
      - run: |
          ffmpeg -y -loglevel error -i "$P/out/silent.mp4" -i "$P/out/sfx.wav" -map 0:v -map 1:a -c:v copy \
            -af loudnorm=I=-14:TP=-1.5:LRA=11 -ar 48000 -c:a aac -b:a 192k -shortest "$P/out/$NAME.mp4"
          ffprobe -v error -show_entries format=duration -of csv=p=0 "$P/out/$NAME.mp4"
          ffmpeg -y -loglevel error -i "$P/out/$NAME.mp4" -vf "fps=1/3,scale=270:-1,tile=6x1" -frames:v 1 "$P/out/${NAME}_sheet.jpg"
      - uses: actions/upload-artifact@v4
        with: { name: video, path: "${{ env.P }}/out/${{ env.NAME }}*" }
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "r${{ github.run_number }}" "$P/out/$NAME.mp4" "$P/out/${NAME}_sheet.jpg" \
            --title "$NAME r${{ github.run_number }}" --notes "Render of projects/$NAME (run ${{ github.run_id }})"
